# Triển khai đầy đủ trên một máy chủ:  docker compose up -d
# Hướng dẫn: docs/trien-khai.md. Biến cấu hình: .env (mẫu ở deploy/.env.example).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Đặt ADMIN_TOKEN trong .env}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      KT_MODEL: ${KT_MODEL:-bkt}
      APP_URL: ${APP_URL:-http://localhost}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - state:/app/state                 # bài làm, tiến độ của người học — SAO LƯU thư mục này
      - rag_index:/app/data/rag_index    # kho giáo trình của khách (để trống thì /ask báo chưa có kho)
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest          # nên ghim phiên bản cụ thể khi triển khai thật
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Có GPU NVIDIA thì bỏ chú thích để nhanh hơn nhiều lần:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Chạy một lần sau khi cài: docker compose --profile setup run --rm models
  models:
    image: ollama/ollama:latest
    profiles: ["setup"]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct} && ollama pull bge-m3"]
    depends_on:
      - ollama

volumes:
  state:
  rag_index:
  ollama:
  caddy_data:
  caddy_config:
